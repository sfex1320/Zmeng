[workspace]
members = [
    "src-crates/app-shared",
    "src-crates/app-utils",
    "src-crates/app-services",
    "src-crates/app-scroll-screenshot-service",
    "src-crates/app-os",
    "src-crates/global_state",
    "src-crates/tauri-commands/core",
    "src-crates/tauri-commands/file",
    "src-crates/tauri-commands/ocr",
    "src-crates/tauri-commands/screenshot",
    "src-crates/tauri-commands/scroll-screenshot",
    "src-crates/tauri-commands/http-service",
    "src-crates/webview",
    "src-crates/http-services",
    "src-crates/zmeng-capture",
]

[package]
name = "zmeng"
version = "0.0.10"
description = "ZMENG - 截图 · 剪贴板 · OCR · 翻译 · AI 一体化效率工具"
authors = ["ZMENG"]
repository = "https://github.com/sfex1320/Zmeng"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "zmeng_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2", features = [] }

[workspace.dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
# xcap = { path = "D:/my-workspace/xcap" }
xcap = { git = "https://github.com/mg-chao/xcap", branch = "custom/master" }
# xcap = { git = "https://github.com/mg-chao/xcap", branch = "custom/master" }
# device_query = "4.0.1"
device_query = { git = "https://github.com/mg-chao/device_query", branch = "custom/master" }
log = "^0.4"
image = { version = "^0.25", features = ["png", "webp"] }
imageproc = "^0.25"
enigo = "0.6.1"
tokio = { version = "1.47.1", features = ["default", "macros", "time"] }
tauri = { version = "^2.8" }
futures = "^0.3"
rayon = "^1.10"
regex = "^1.11"
zune-jpegxl = "^0.4"
zune-core = "0.4"
scap = { git = "https://github.com/mg-chao/scap", branch = "20250712_custom" }
objc2 = "0.6.1"
objc2-app-kit = { version = "0.3.1" }
objc2-foundation = { version = "0.3.1" }
uiautomation = "0.24.0"
macos-accessibility-client = "0.0.1"
dashmap = "6.1.0"
reqwest = "0.12"
futures-lite = "2.6.1"
tokio-util = "0.7.16"
futures-util = "0.3"
windows = "0.61"
base64 = "^0.22"
tauri-plugin-clipboard-manager = "^2"
clipboard-win = "5.4.1"

# 项目内依赖
zmeng-app-services = { path = "src-crates/app-services" }
zmeng-app-os = { path = "src-crates/app-os" }
zmeng-app-utils = { path = "src-crates/app-utils" }
zmeng-app-shared = { path = "src-crates/app-shared" }
zmeng-app-scroll-screenshot-service = { path = "src-crates/app-scroll-screenshot-service" }
zmeng-tauri-commands-core = { path = "src-crates/tauri-commands/core" }
zmeng-tauri-commands-file = { path = "src-crates/tauri-commands/file" }
zmeng-tauri-commands-ocr = { path = "src-crates/tauri-commands/ocr" }
zmeng-tauri-commands-screenshot = { path = "src-crates/tauri-commands/screenshot" }
zmeng-tauri-commands-scroll-screenshot = { path = "src-crates/tauri-commands/scroll-screenshot" }
zmeng-tauri-commands-http-service = { path = "src-crates/tauri-commands/http-service" }
zmeng-plugin-service = { path = "src-crates/plugin-service" }
zmeng-webview = { path = "src-crates/webview" }
zmeng-http-services = { path = "src-crates/http-services" }
zmeng-global-state = { path = "src-crates/global_state" }


[dependencies]
zmeng-app-shared = { workspace = true }
zmeng-app-services = { workspace = true }
zmeng-app-os = { workspace = true }
zmeng-app-scroll-screenshot-service = { workspace = true }
zmeng-tauri-commands-core = { workspace = true }
zmeng-tauri-commands-file = { workspace = true }
zmeng-tauri-commands-ocr = { workspace = true }
zmeng-tauri-commands-screenshot = { workspace = true }
zmeng-tauri-commands-scroll-screenshot = { workspace = true }
zmeng-plugin-service = { workspace = true }
zmeng-app-utils = { workspace = true }
zmeng-webview = { workspace = true }
zmeng-http-services = { workspace = true }
zmeng-tauri-commands-http-service = { workspace = true }
zmeng-global-state = { workspace = true }

# workspace 依赖
tokio = { workspace = true }
log = { workspace = true }

# tauri 相关
tauri = { workspace = true, features = [
    "protocol-asset",
    "macos-private-api",
    "tray-icon",
    "image-ico",
    "image-png",
] }
tauri-build = "^2"
tauri-plugin-log = "^2"
tauri-plugin-fs = "^2"
tauri-plugin-dialog = "^2"
tauri-plugin-http = "^2"
tauri-plugin-store = "^2"
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-opener = "^2"
tauri-plugin-clipboard = "^2"
tauri-plugin-process = "^2"
tauri-plugin-notification = "^2"
tauri-plugin-os = "^2"
tauri-plugin-macos-permissions = "2.3.0"
# ZMENG：原生系统级拖放（OLE / CF_HDROP），把真实文件拖入设计/聊天软件，避免网页 HTML5 拖拽泄漏 base64
tauri-plugin-drag = "2.1.1"


# 其他依赖
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# ZMENG：本地/直连 AI 请求（绕过系统代理、不带 Origin，避免本地 Ollama CORS 拒绝）
reqwest = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "^2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[target.'cfg(any(target_os = "windows"))'.dependencies]

# dhat = "0.3.3"

[profile.dev]
incremental = true
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.package.zmeng-app-services]
[profile.dev.package.zmeng-app-os]
[profile.dev.package.zmeng-app-utils]
[profile.dev.package.zmeng-app-shared]
[profile.dev.package.zmeng-app-scroll-screenshot-service]
[profile.dev.package.zmeng-global-state]
[profile.dev.package.zmeng-tauri-commands-core]
[profile.dev.package.zmeng-tauri-commands-file]
[profile.dev.package.zmeng-tauri-commands-ocr]
[profile.dev.package.zmeng-tauri-commands-screenshot]
[profile.dev.package.zmeng-tauri-commands-scroll-screenshot]
[profile.dev.package.zmeng-webview]
opt-level = 2
debug = true

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
# 为加快打包：fat LTO 改 thin（链接快很多、运行差别可忽略），codegen-units 改 16（并行代码生成），
# 开启 incremental（改 Rust 后只重编改动部分）。代价：exe 略大、运行性能差异对本工具可忽略。
lto = "thin"
panic = "unwind"
incremental = true
codegen-units = 16
strip = true

# [profile.release]
# debug = 1

[features]
dhat-heap = []   # if you are doing heap profiling
dhat-ad-hoc = [] # if you are doing ad hoc profiling
