[package]
name = "zmeng-capture"
version = "0.1.0"
description = "ZMENG 自研屏幕采集层（DXGI Desktop Duplication 为主，GDI BitBlt 回退）——复刻阶段二，替代 xcap fork"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
image = { workspace = true }
log = { workspace = true }
serde = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_UI_HiDpi",
] }
